name: VaultUI
options:
  bundleIdPrefix: de.tobisk.apps.vaultui
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false
  groupSortPosition: none

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false

packages:
  VaultUI:
    path: .

targets:
  VaultUI:
    type: application
    platform: macOS
    sources:
      - path: Sources/VaultUIApp
        excludes:
          - Info.plist
    dependencies:
      - package: VaultUI
        product: VaultAppUI
      - package: VaultUI
        product: VaultServices
      - package: VaultUI
        product: VaultCrypto
      - package: VaultUI
        product: VaultModels
      - package: VaultUI
        product: VaultAPI
      - package: VaultUI
        product: VaultSync
      - package: VaultUI
        product: VaultSSH
      - target: VaultAutoFillExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.tobisk.apps.vaultui
        CODE_SIGN_ENTITLEMENTS: VaultUI.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: F55HNXZ7TD
        INFOPLIST_FILE: Sources/VaultUIApp/Info.plist
        PRODUCT_NAME: "Vault UI"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true

  VaultAutoFillExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/VaultAutoFillExtension
        excludes:
          - Info.plist
    dependencies:
      - package: VaultUI
        product: VaultModels
      - package: VaultUI
        product: VaultCrypto
      - package: VaultUI
        product: VaultServices
      - package: VaultUI
        product: VaultAPI
      - package: VaultUI
        product: VaultSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.tobisk.apps.vaultui.AutoFillExtension
        CODE_SIGN_ENTITLEMENTS: VaultAutoFillExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: F55HNXZ7TD
        INFOPLIST_FILE: Sources/VaultAutoFillExtension/Info.plist
        PRODUCT_NAME: VaultAutoFillExtension
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        ENABLE_HARDENED_RUNTIME: true
