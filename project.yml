name: VaultUI
options:
  bundleIdPrefix: de.tobisk.apps.vaultui
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false
  groupSortPosition: none

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false

packages:
  VaultUI:
    path: .

targets:
  VaultUI:
    type: application
    platform: macOS
    sources:
      - path: Sources/VaultUIApp
        excludes:
          - Info.plist
    dependencies:
      - package: VaultUI
        product: VaultAppUI
      - package: VaultUI
        product: VaultServices
      - package: VaultUI
        product: VaultCrypto
      - package: VaultUI
        product: VaultModels
      - package: VaultUI
        product: VaultAPI
      - package: VaultUI
        product: VaultSync
      - package: VaultUI
        product: VaultSSH
      - target: VaultAutoFillExtension
        embed: true
      - target: VaultSafariExtension
        embed: true
    preBuildScripts:
      - name: "Build CLI Tool"
        script: |
          cd "${SRCROOT}"
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
            swift build --target VaultCLI -c $(echo "${CONFIGURATION}" | tr '[:upper:]' '[:lower:]') 2>&1 \
            | grep -v "^warning:" || true
    postBuildScripts:
      - name: "Embed CLI Tool"
        script: |
          CONFIG_LOWER=$(echo "${CONFIGURATION}" | tr '[:upper:]' '[:lower:]')
          CLI_SRC="${SRCROOT}/.build/${CONFIG_LOWER}/vaultui"
          if [ ! -f "$CLI_SRC" ]; then
            CLI_SRC="${SRCROOT}/.build/arm64-apple-macosx/${CONFIG_LOWER}/vaultui"
          fi
          CLI_DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/MacOS/vaultui"
          if [ -f "$CLI_SRC" ]; then
            cp "$CLI_SRC" "$CLI_DST"
            echo "note: Embedded vaultui CLI into app bundle"
          else
            echo "warning: vaultui CLI not found — run 'swift build --target VaultCLI' manually"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.tobisk.apps.vaultui
        CODE_SIGN_ENTITLEMENTS: VaultUI.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: F55HNXZ7TD
        INFOPLIST_FILE: Sources/VaultUIApp/Info.plist
        PRODUCT_NAME: "Vault UI"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true


  VaultAutoFillExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/VaultAutoFillExtension
        excludes:
          - Info.plist
      - path: Sources/VaultUIApp/Assets.xcassets
    dependencies:
      - package: VaultUI
        product: VaultModels
      - package: VaultUI
        product: VaultCrypto
      - package: VaultUI
        product: VaultServices
      - package: VaultUI
        product: VaultAPI
      - package: VaultUI
        product: VaultSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.tobisk.apps.vaultui.AutoFillExtension
        CODE_SIGN_ENTITLEMENTS: VaultAutoFillExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: F55HNXZ7TD
        INFOPLIST_FILE: Sources/VaultAutoFillExtension/Info.plist
        PRODUCT_NAME: VaultAutoFillExtension
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: ExtensionIcon
        COMBINE_HIDPI_IMAGES: true

  VaultSafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/VaultSafariExtension
        excludes:
          - Info.plist
      - path: Sources/VaultUIApp/Assets.xcassets
    dependencies:
      - package: VaultUI
        product: VaultModels
      - package: VaultUI
        product: VaultCrypto
      - package: VaultUI
        product: VaultServices
      - package: VaultUI
        product: VaultAPI
      - package: VaultUI
        product: VaultSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.tobisk.apps.vaultui.SafariExtension
        CODE_SIGN_ENTITLEMENTS: VaultSafariExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: F55HNXZ7TD
        INFOPLIST_FILE: Sources/VaultSafariExtension/Info.plist
        PRODUCT_NAME: VaultSafariExtension
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: ExtensionIcon
        COMBINE_HIDPI_IMAGES: true
