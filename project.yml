name: VaultUI
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false
  groupSortPosition: none

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false

packages:
  VaultUI:
    path: .

targets:
  VaultUI:
    type: application
    platform: macOS
    sources:
      - path: Sources/VaultUIApp
        excludes:
          - Info.plist
    dependencies:
      - package: VaultUI
        product: VaultAppUI
      - package: VaultUI
        product: VaultServices
      - package: VaultUI
        product: VaultCrypto
      - package: VaultUI
        product: VaultModels
      - package: VaultUI
        product: VaultAPI
      - package: VaultUI
        product: VaultSync
      - package: VaultUI
        product: VaultSSH
      - target: VaultAutoFillExtension
        embed: true
      - target: VaultSafariExtension
        embed: true
    preBuildScripts:
      - name: "Build CLI Tool"
        script: |
          cd "${SRCROOT}"
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
            swift build --product vaultui -c $(echo "${CONFIGURATION}" | tr '[:upper:]' '[:lower:]') 2>&1 \
            | grep -v "^warning:" || true
    postBuildScripts:
      - name: "Embed CLI Tool"
        script: |
          CONFIG_LOWER=$(echo "${CONFIGURATION}" | tr '[:upper:]' '[:lower:]')
          CLI_SRC="${SRCROOT}/.build/${CONFIG_LOWER}/vaultui"
          if [ ! -f "$CLI_SRC" ]; then
            CLI_SRC=$(find "${SRCROOT}/.build" -type f -path "*/${CONFIG_LOWER}/vaultui" | head -n 1)
          fi
          CLI_DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/MacOS/vaultui"
          if [ -n "$CLI_SRC" ] && [ -f "$CLI_SRC" ]; then
            cp "$CLI_SRC" "$CLI_DST"
            chmod 755 "$CLI_DST"

            if [ "${CODE_SIGNING_ALLOWED:-NO}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
              codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --options runtime "$CLI_DST"
              echo "note: Signed embedded vaultui CLI with hardened runtime"
            fi

            AGENT_APP="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Helpers/VaultUIAgent.app"
            AGENT_CLI="${AGENT_APP}/Contents/MacOS/vaultui"
            mkdir -p "${AGENT_APP}/Contents/MacOS"
            cp "$CLI_SRC" "$AGENT_CLI"
            chmod 755 "$AGENT_CLI"

            cat > "${AGENT_APP}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>${DEVELOPMENT_LANGUAGE}</string>
            <key>CFBundleExecutable</key>
            <string>vaultui</string>
            <key>CFBundleIdentifier</key>
            <string>${VAULTUI_BUNDLE_ID}</string>
            <key>CFBundleName</key>
            <string>Vault UI Agent</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${MARKETING_VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${CURRENT_PROJECT_VERSION}</string>
            <key>LSBackgroundOnly</key>
            <true/>
          </dict>
          </plist>
          EOF

            if [ -n "${EXPANDED_PROVISIONING_PROFILE:-}" ] && [ -f "${EXPANDED_PROVISIONING_PROFILE}" ]; then
              cp "${EXPANDED_PROVISIONING_PROFILE}" "${AGENT_APP}/Contents/embedded.provisionprofile"
            elif [ -f "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/embedded.provisionprofile" ]; then
              cp "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/embedded.provisionprofile" "${AGENT_APP}/Contents/embedded.provisionprofile"
            fi

            if [ "${CODE_SIGNING_ALLOWED:-NO}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
              AGENT_ENTITLEMENTS="${TARGET_TEMP_DIR}/vaultui-agent.entitlements"
              cat > "$AGENT_ENTITLEMENTS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.application-identifier</key>
            <string>${AppIdentifierPrefix}${VAULTUI_BUNDLE_ID}</string>
            <key>com.apple.developer.team-identifier</key>
            <string>${VAULTUI_DEVELOPMENT_TEAM}</string>
            <key>com.apple.security.device.authentication</key>
            <true/>
            <key>com.apple.security.network.client</key>
            <true/>
            <key>com.apple.security.network.server</key>
            <true/>
            <key>keychain-access-groups</key>
            <array>
              <string>${AppIdentifierPrefix}${VAULTUI_BUNDLE_ID}</string>
              <string>${AppIdentifierPrefix}${VAULTUI_KEYCHAIN_GROUP}</string>
            </array>
          </dict>
          </plist>
          EOF
              codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --identifier "${VAULTUI_BUNDLE_ID}" --options runtime --entitlements "$AGENT_ENTITLEMENTS" "$AGENT_CLI"
              codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --identifier "${VAULTUI_BUNDLE_ID}" --options runtime --entitlements "$AGENT_ENTITLEMENTS" "$AGENT_APP"
              echo "note: Signed VaultUIAgent.app helper with keychain entitlements"
            fi
            echo "note: Embedded vaultui CLI into app bundle"
          else
            echo "warning: vaultui CLI not found — run 'swift build --product vaultui' manually"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VAULTUI_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: VaultUI.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(VAULTUI_DEVELOPMENT_TEAM)
        INFOPLIST_FILE: Sources/VaultUIApp/Info.plist
        PRODUCT_NAME: "Vault UI"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true


  VaultAutoFillExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/VaultAutoFillExtension
        excludes:
          - Info.plist
      - path: Sources/VaultUIApp/Assets.xcassets
    dependencies:
      - package: VaultUI
        product: VaultModels
      - package: VaultUI
        product: VaultCrypto
      - package: VaultUI
        product: VaultServices
      - package: VaultUI
        product: VaultAPI
      - package: VaultUI
        product: VaultSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VAULTUI_AUTOFILL_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: VaultAutoFillExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(VAULTUI_DEVELOPMENT_TEAM)
        INFOPLIST_FILE: Sources/VaultAutoFillExtension/Info.plist
        PRODUCT_NAME: VaultAutoFillExtension
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: ExtensionIcon
        COMBINE_HIDPI_IMAGES: true

  VaultSafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/VaultSafariExtension
        excludes:
          - Info.plist
          - Resources/icons
      - path: Sources/VaultSafariExtension/Resources/icons
        type: folder
      - path: Sources/VaultUIApp/Assets.xcassets
    dependencies:
      - package: VaultUI
        product: VaultModels
      - package: VaultUI
        product: VaultCrypto
      - package: VaultUI
        product: VaultServices
      - package: VaultUI
        product: VaultAPI
      - package: VaultUI
        product: VaultSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VAULTUI_SAFARI_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: VaultSafariExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(VAULTUI_DEVELOPMENT_TEAM)
        INFOPLIST_FILE: Sources/VaultSafariExtension/Info.plist
        PRODUCT_NAME: VaultSafariExtension
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true

schemes:
  VaultUI:
    build:
      targets:
        VaultUI: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
